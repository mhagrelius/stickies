# Flatpak manifest for the Stickies *application*.
#
# Read this first: a Flatpak cannot ship the GNOME Shell extension. Extensions
# are loaded as JavaScript into the gnome-shell process from two fixed
# unsandboxed directories, and nothing inside a sandbox can put a file there.
# So this packages one half; the extension is installed separately, from
# extensions.gnome.org or via packaging/build-extension-zip.sh.
#
# Without the extension the app still keeps notes, colours and sizes — only
# window placement is left to Mutter.
#
# Build:  packaging/build-flatpak.sh

id: us.hagreli.Stickies

# GNOME 50: the first runtime carrying libadwaita 1.9, which this is compiled
# against (AdwShortcutsDialog), and GTK 4.22. GTK must be at least 4.16 for the
# CSS custom properties the note palettes are built on.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: stickies

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Reach the shell extension. Strictly this is redundant — Flatpak already
  # permits an app to talk to names under its own ID — but stating it keeps the
  # dependency visible to anyone auditing the permissions.
  - --talk-name=us.hagreli.Stickies.Shell

  # Deliberately absent:
  #   --filesystem=*      notes live in the app's own XDG data dir
  #   --share=network     nothing here talks to the network
  #   --talk-name=org.gnome.Shell   placement goes through the extension's own
  #                                 narrow interface, never the shell's

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/stickies/cargo
  # No --share=network build-arg: Flathub builds with the network off, and
  # cargo-sources.json supplies every crate with a checksum, so it is not
  # needed. Adding it back would make this unacceptable for submission.

modules:
  - name: stickies
    buildsystem: simple
    build-options:
      env:
        # Dependencies come from cargo-sources.json, not the network, so
        # Flathub's offline builders can reproduce this.
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked

      - install -Dm755 target/release/stickies /app/bin/stickies
      - install -Dm644 data/us.hagreli.Stickies.desktop
          /app/share/applications/us.hagreli.Stickies.desktop
      - install -Dm644 data/us.hagreli.Stickies.metainfo.xml
          /app/share/metainfo/us.hagreli.Stickies.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/us.hagreli.Stickies.svg
          /app/share/icons/hicolor/scalable/apps/us.hagreli.Stickies.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/us.hagreli.Stickies-symbolic.svg
          /app/share/icons/hicolor/symbolic/apps/us.hagreli.Stickies-symbolic.svg

      # Required: the desktop file is DBusActivatable, and build-export fails
      # hard if the matching service file is missing.
      - install -Dm644 packaging/flatpak/us.hagreli.Stickies.service
          /app/share/dbus-1/services/us.hagreli.Stickies.service

    sources:
      # Local builds read the working tree. For a Flathub submission, replace
      # this with the tagged release:
      #
      #   - type: git
      #     url: https://github.com/hagrelius/stickies.git
      #     tag: v0.1.0
      #     commit: <full sha>
      - type: dir
        path: ../..

      # Generated by build-flatpak.sh from Cargo.lock.
      - cargo-sources.json
