<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Two stacked notes with a folded corner: legible at 16px, where the
       fold is the only detail that survives. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aad1f3"/>
      <stop offset="1" stop-color="#87b8e8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0b0"/>
      <stop offset="1" stop-color="#f4de74"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-8 64 64)">
    <rect x="22" y="18" width="74" height="74" rx="6" fill="url(#back)"/>
  </g>

  <g transform="rotate(4 64 64)">
    <path d="M26 30 h72 a6 6 0 0 1 6 6 v50 l-24 24 h-54 a6 6 0 0 1 -6 -6 v-68 a6 6 0 0 1 6 -6 z"
          fill="url(#front)"/>
    <path d="M104 86 l-24 24 v-18 a6 6 0 0 1 6 -6 z" fill="#dcc25a"/>
    <g stroke="#8a7628" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <path d="M40 50 h50"/>
      <path d="M40 66 h50"/>
      <path d="M40 82 h30"/>
    </g>
  </g>
</svg>
